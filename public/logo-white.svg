<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" width="360" height="64">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
    .homeroom-wordmark {
      font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
      font-weight: 700;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
  </style>

  <!-- icon mark: rounded-square outline containing a notebook + pen glyph, all white so it drops onto any dark or colored background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-width="3"/>

  <rect x="18" y="14" width="24" height="32" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="13" y1="21" x2="18" y2="21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="13" y1="30" x2="18" y2="30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="13" y1="39" x2="18" y2="39" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="19" y1="43" x2="46" y2="16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="46" cy="16" r="2.2" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="84" y="45" class="homeroom-wordmark">Homeroom</text>
</svg>
